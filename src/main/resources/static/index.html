<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartStock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">SmartStock</div>
    <nav>
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="products">Products</button>
      <button data-view="categories">Categories</button>
      <button data-view="suppliers">Suppliers</button>
      <button data-view="stock">Stock movements</button>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <h1 id="title">Dashboard</h1>
      <div id="actions" class="actions"></div>
    </header>
    <section id="content"></section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="modal">
    <form id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" id="modalCancel" class="btn ghost">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
